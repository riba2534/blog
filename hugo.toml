DefaultContentLanguage = "zh"
description = "🌀riba2534's Blog"
enableEmoji = true
enableGitInfo = true
locale = "zh-cn"
theme = "diary"
title = "🌀riba2534's Blog"
baseURL = "https://blog.riba2534.cn/"
relativeURLs = true



[markup]
[markup.highlight]
codeFences = true
guessSyntax = false
hl_Lines = ""
lineNoStart = 1
lineNos = true
lineNumbersInTable = true
# class 模式：高亮样式走独立可缓存的 chroma.scss，而非每个 token 内联 style（长文 HTML 可瘦 20%+）
noClasses = false
style = "github"
tabWidth = 4

[markup.goldmark.renderer]
unsafe = true

# 中英混排下 typographer 的引号配对经常一半弯一半直（实测 85 处错配），
# 还会把 --force 这类 CLI 参数改成 –force；中文全角标点与破折号均为手打字面字符，
# 自动替换的正收益趋近于零，故整体关闭
[markup.goldmark.extensions.typographer]
disable = true

[markup.goldmark.extensions.cjk]
enable = true
eastAsianLineBreaks = true
escapedSpace = true

# 数学公式在构建期由 render-passthrough.html 调 transform.ToMath 渲染，浏览器端零 JS。
# 刻意不启用单个 $ 作为内联定界符（会误伤正文里的美元符号），内联公式一律用 \( \)
[markup.goldmark.extensions.passthrough]
enable = true
[markup.goldmark.extensions.passthrough.delimiters]
block = [['\[', '\]'], ['$$', '$$']]
inline = [['\(', '\)']]

# 分页列表不再生成 /page/1/ 跳转页（曾产出 202 个无流量入口的冗余文件）
[pagination]
disableAliases = true

[params]
author = "riba2534"
# enableGitalk = false
enableOpenGraph = true
enableTwitterCards = true
title = "🌀riba2534's Blog"
description = "riba2534的个人技术博客，分享编程、投资、生活的思考与经验"
enableMermaid = true
enableReadingTime = true
# favicon = "👋"  # emoji favicon 使用下方内联方式
subtitle = "凡事有交代，件件有着落，事事有回音"
twikooEnvId = "https://twikoo.riba2534.cn"
enableTwikoo = true 

# [params.gitalk]
# owner = "user"
# repo = "repo name"
# client_id = "your client id"
# client_secret = "your client secret"

# 只保留首页与分区的 RSS；标签/分类/系列不再输出 RSS（此前 197 个无人订阅的 XML 占产物 5MB+）
[outputs]
home = ["html", "rss"]
section = ["html", "rss"]
taxonomy = ["html"]
term = ["html"]
page = ["html"]

[services.rss]
limit = 20

[taxonomies]
category = "categories"
series = "series"
tag = "tags"


